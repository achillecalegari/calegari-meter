<line x1="544.2" y1="374.2" x2="692" y2="435" stroke="#86868b" stroke-width="1"/>
<circle cx="544.2" cy="374.2" r="2.6" fill="#c8102e"/>
<text x="700" y="440" font-size="14" font-weight="600" fill="#111112">1  The window's rim</text>
<text x="718" y="458" font-size="12.5" fill="#86868b">the glass stops on it</text>
<line x1="505.9" y1="293.6" x2="692" y2="379" stroke="#86868b" stroke-width="1"/>
<circle cx="505.9" cy="293.6" r="2.6" fill="#c8102e"/>
<text x="700" y="384" font-size="14" font-weight="600" fill="#111112">2  The board</text>
<text x="718" y="402" font-size="12.5" fill="#86868b">pushed toward the face</text>
<line x1="531.2" y1="262.4" x2="692" y2="323" stroke="#86868b" stroke-width="1"/>
<circle cx="531.2" cy="262.4" r="2.6" fill="#c8102e"/>
<text x="700" y="328" font-size="14" font-weight="600" fill="#111112">3  A foot of the tray</text>
<text x="718" y="346" font-size="12.5" fill="#86868b">on the board, clear of its parts</text>
<line x1="486.4" y1="229.9" x2="692" y2="267" stroke="#86868b" stroke-width="1"/>
<circle cx="486.4" cy="229.9" r="2.6" fill="#c8102e"/>
<text x="700" y="272" font-size="14" font-weight="600" fill="#111112">4  The tray</text>
<text x="718" y="290" font-size="12.5" fill="#86868b">wall to wall</text>
<line x1="559.2" y1="239.6" x2="692" y2="211" stroke="#86868b" stroke-width="1"/>
<circle cx="559.2" cy="239.6" r="2.6" fill="#c8102e"/>
<text x="700" y="216" font-size="14" font-weight="600" fill="#111112">5  A leaf spring</text>
<text x="718" y="234" font-size="12.5" fill="#86868b">pressed 0.25 mm, printed flat</text>
<line x1="559.2" y1="166.2" x2="692" y2="155" stroke="#86868b" stroke-width="1"/>
<circle cx="559.2" cy="166.2" r="2.6" fill="#c8102e"/>
<text x="700" y="160" font-size="14" font-weight="600" fill="#111112">6  A post in the lid</text>
<text x="718" y="178" font-size="12.5" fill="#86868b">the lid snaps on and presses</text>
<line x1="505.9" y1="157.1" x2="692" y2="99" stroke="#86868b" stroke-width="1"/>
<circle cx="505.9" cy="157.1" r="2.6" fill="#c8102e"/>
<text x="700" y="104" font-size="14" font-weight="600" fill="#111112">7  The battery</text>
<text x="718" y="122" font-size="12.5" fill="#86868b">never squeezed: 0.3 mm to spare</text>
<text x="330" y="408" font-size="12" text-anchor="middle" fill="#86868b">the face, the glass 0.6 mm proud</text>
</svg>