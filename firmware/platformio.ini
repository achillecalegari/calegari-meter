; Calegari Meter firmware, for the Waveshare ESP32-S3-Touch-AMOLED-1.8
; pio run -t upload        (hold the red key while plugging in if the port does not show)

[env:meter]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DXPOWERS_CHIP_AXP2101
lib_deps =
  moononournation/GFX Library for Arduino@1.6.8
  lewisxhe/XPowersLib@0.2.6
  adafruit/Adafruit XCA9554@^1.0.0
  adafruit/Adafruit AS7341@^1.4.1
